name: Validate menu data

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Validate days
        run: uv run tools/validate.py

      - name: Check days.json is up to date
        run: uv run tools/build_index.py --check
